; ESP32 file sender. Build/flash:  pio run -t upload
; Upload the files in data/:        pio run -t uploadfs
; Serial monitor:                   pio device monitor
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
; lib/lk_media holds the framing code and the generated nanopb sources
; (scripts/generate-esp32.ps1); only the nanopb runtime comes from the registry.
lib_deps = nanopb/Nanopb@^0.4.8

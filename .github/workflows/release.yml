name: Release Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Bundle version label for manual dispatch (e.g. v0.2.0-rc1)'
        required: false
        default: 'snapshot'

permissions:
  contents: read

env:
  GO_VERSION: '1.25.1'
  DOTNET_VERSION: '10.0.x'
  # Pinned so CI matches the development SDK; 'stable' moved past 3.47 and
  # started flagging package:flutter/material.dart as deprecated (material_ui).
  FLUTTER_VERSION: '3.47.5'
  MAUI_WINDOWS_TFM: 'net10.0-windows10.0.19041.0'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Portable 3-Laptop Server + Config + ONNX Model Bundles (Linux & Windows)
  # ---------------------------------------------------------------------------
  build-lab-bundles:
    name: Build 3-Laptop Lab Bundles (Linux & Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Go unit tests
        env:
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Package Windows & Linux 3-laptop deployment archives
        env:
          CGO_ENABLED: '0'
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_label || 'snapshot' }}
        run: |
          for target in "linux:amd64:" "windows:amd64:.exe"; do
            IFS=':' read -r goos goarch ext <<< "$target"
            stage="release-stage/livekalman-lab-${goos}-${goarch}"
            mkdir -p "${stage}/bin" "${stage}/ml/models"

            for role in controller receiver sender; do
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" \
                -o "${stage}/bin/${role}${ext}" "./server/${role}"
            done
            for tool in labctl datagen mediagen; do
              GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w" \
                -o "${stage}/bin/${tool}${ext}" "./cmd/${tool}"
            done

            cp -r configs examples "${stage}/"
            cp ml/models/r_policy.onnx ml/models/report.json "${stage}/ml/models/"
            cp scripts/run-role.ps1 scripts/run-all.ps1 scripts/stop-all.ps1 "${stage}/"
            cp README.md "${stage}/" 2>/dev/null || true

            mkdir -p release-artifacts
            if [ "$goos" = "windows" ]; then
              (cd release-stage && zip -qr "../release-artifacts/livekalman-lab-${VERSION_TAG}-windows-amd64.zip" "livekalman-lab-windows-amd64")
            else
              tar -C release-stage -czf "release-artifacts/livekalman-lab-${VERSION_TAG}-linux-amd64.tar.gz" "livekalman-lab-linux-amd64"
            fi
          done
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Upload server bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab-server-bundles
          path: release-artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Windows Desktop Dashboards (Flutter Signal Monitor + .NET 10 MAUI Studio)
  # ---------------------------------------------------------------------------
  build-windows-dashboards:
    name: Build Windows Dashboards (Flutter & .NET MAUI)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI Windows workload
        shell: pwsh
        run: dotnet workload install maui-windows

      - name: Build & archive Flutter Signal Monitor (Windows Release)
        shell: pwsh
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_label || 'snapshot' }}
        run: |
          New-Item -ItemType Directory -Force release-win | Out-Null
          Push-Location apps/flutter/signal_monitor
          flutter pub get
          flutter build windows --release
          Pop-Location
          Compress-Archive `
            -Path "apps/flutter/signal_monitor/build/windows/x64/runner/Release/*" `
            -DestinationPath "release-win/livekalman-signal-monitor-$env:VERSION_TAG-windows-x64.zip" `
            -Force

      - name: Publish & archive Live Kalman Studio (.NET 10 MAUI Windows Release)
        shell: pwsh
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version_label || 'snapshot' }}
        run: |
          dotnet publish apps/dotnet/StreamingLiveKalmanFilter.Maui/StreamingLiveKalmanFilter.Maui.csproj `
            -p:TargetFrameworks=${{ env.MAUI_WINDOWS_TFM }} `
            -f ${{ env.MAUI_WINDOWS_TFM }} `
            -c Release `
            -p:WindowsPackageType=None `
            -o publish-maui `
            --nologo
          Compress-Archive `
            -Path "publish-maui/*" `
            -DestinationPath "release-win/livekalman-studio-maui-$env:VERSION_TAG-windows-x64.zip" `
            -Force

      - name: Upload Windows dashboard archives
        uses: actions/upload-artifact@v4
        with:
          name: windows-dashboard-bundles
          path: release-win/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish GitHub Release (Tags Only)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-lab-bundles, build-windows-dashboards]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Compute combined SHA256SUMS.txt
        run: |
          cd dist-release
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-release/*

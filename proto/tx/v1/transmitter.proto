syntax = "proto3";

package livekalman.tx.v1;
option go_package = "github.com/streaming-live-kalman/filter/gen/tx/v1;txv1";

import "common/v1/common.proto";

message TxConfig {
  uint64 command_id = 1;
  uint64 version = 2;
  uint64 effective_sequence = 3;
  uint32 symbol_rate = 4;
  float amplitude = 5;
  float noise_stddev = 6;
}

message ApplyTxReply {
  bool accepted = 1;
  string reason = 2;
  uint64 applied_version = 3;
}

message TxStatus {
  uint64 active_version = 1;
  bool running = 2;
  uint64 sequence = 3;
  string run_id = 4;
}

message TxEvent {
  uint64 sequence = 1;
  string description = 2;
  TxFrameTrace trace = 3;
}

// TxFrameTrace is a reduced diagnostic view of a real signal frame. It is
// intentionally bounded so dashboards never subscribe to the full sample-rate
// stream used between Sender and Receiver.
message TxFrameTrace {
  uint64 sequence = 1;
  string transfer_id = 2;
  string file_name = 3;
  uint64 media_offset = 4;
  uint64 total_bytes = 5;
  bytes original_bytes = 6;
  bytes encoded_bytes = 7;
  bytes scrambled_bytes = 8;
  string payload_bits = 9;
  repeated float clean_symbols = 10;
  repeated float noisy_samples = 11;
  float noise_stddev = 12;
  bool grpc_sent = 13;
  uint64 observed_at_unix_ms = 14;
}

service TransmitterService {
  rpc ApplyTransmitterConfig(TxConfig) returns (ApplyTxReply);
  rpc GetTxStatus(livekalman.common.v1.Empty) returns (TxStatus);
  rpc WatchTxEvents(livekalman.common.v1.Empty) returns (stream TxEvent);
}
